services:
  mongodb:
    image: mongo:7.0
    container_name: actowiz-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: actowiz-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/actowiz_task_manager
      - JWT_SECRET=actowiz_docker_jwt_secret_key_2026
      - JWT_EXPIRES_IN=24h
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: actowiz-client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo-data:

